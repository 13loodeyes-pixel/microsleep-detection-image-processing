<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard </title>
    <link rel="stylesheet" href="MainPage.css">
    <script type="text/javascript" src="/eel.js"></script>
</head>
<body>
    <div class = 'container'>
        <div class = 'title'>
            <h1>MicroSleep Dashboard</h1>
            <p id="msg_error"></p>
        </div>

        <div class = 'body'>

            <div class="search-container">
                <input type = "text" placeholder="Search User" id ='serach_bar'>
                <button id="seach_btn"><img src="icon/find.png"></button>
            </div>

            <div class="btn-container">
                <button><img src="icon/sleep-mask.png" id="ms-eyeclose"> </button>
                <p>Total Eyes Closed Per Day</p>
            </div>

            <div class="btn-container">
                <button><img src="icon/hands.png" id="ms-pattern"> </button>
                <p>Daily Microsleep Pattern</p>
            </div>

            <div class="btn-container">
                <button><img src="icon/sleeping.png" id="ms-peakhour"> </button>
                <p>Duration And Peak Time</p>
            </div>

            <div class="btn-container">
                <button><img src="icon/facial-recognition.png" id="face-register"> </button>
                <p>User Register</p>
            </div>


        </div>

    </div>

    <script src="MainPage.js"></script>

</body>
</html>
